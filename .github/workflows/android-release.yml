name: Android release

on:
  push:
    tags:
      - "android-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Read release version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#android-v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must use android-vMAJOR.MINOR.PATCH, for example android-v0.1.1"
            exit 1
          fi
          IFS=. read -r major minor patch <<< "$version"
          version_code=$((major * 1000000 + minor * 1000 + patch + 1))
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Prepare Android signing key
        env:
          KI_RELEASE_KEYSTORE_BASE64: ${{ secrets.KI_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KI_RELEASE_KEYSTORE_BASE64" ]; then
            echo "Configure the Android signing secrets in the repository before publishing a release."
            exit 1
          fi
          printf '%s' "$KI_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ki-companion-release.jks"
          test -s "$RUNNER_TEMP/ki-companion-release.jks"

      - name: Build signed APK
        env:
          KI_RELEASE_STORE_FILE: ${{ runner.temp }}/ki-companion-release.jks
          KI_RELEASE_STORE_PASSWORD: ${{ secrets.KI_RELEASE_STORE_PASSWORD }}
          KI_RELEASE_KEY_ALIAS: ${{ secrets.KI_RELEASE_KEY_ALIAS }}
          KI_RELEASE_KEY_PASSWORD: ${{ secrets.KI_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KI_RELEASE_STORE_PASSWORD" ] || [ -z "$KI_RELEASE_KEY_ALIAS" ] || [ -z "$KI_RELEASE_KEY_PASSWORD" ]; then
            echo "All Android signing secrets are required."
            exit 1
          fi
          android/gradlew --no-daemon -p android :app:assembleRelease \
            "-PappVersionName=${{ steps.version.outputs.name }}" \
            "-PappVersionCode=${{ steps.version.outputs.code }}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "android/app/build/outputs/apk/release/app-release.apk#KiCompanion.apk" \
            --title "Ki Companion ${{ steps.version.outputs.name }}" \
            --generate-notes
